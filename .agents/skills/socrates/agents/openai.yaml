interface:
  display_name: "Socrates"
  short_description: "Align intent, visualize decisions, then implement"
  default_prompt: "Use $socrates to build shared understanding. For coding, inspect the context, clarify consequential gaps in my intent, cross-check the design with useful diagrams, and implement after the concrete scope is confirmed. For learning, explain visually and check one key relationship at a time."
policy:
  allow_implicit_invocation: true
